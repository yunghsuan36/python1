# 每次開 PR 或推新 commit 到 PR 時，讓 Claude 自動做 code review
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest

    # 權限越小越好：只能讀程式碼、在 PR 上留言，不能修改程式碼
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          # 使用 Claude 訂閱產生的 token（存放在 repo 的 Secrets 裡）
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # 在 PR 上建立一則留言，即時顯示 review 進度
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            請用繁體中文 review 這個 Pull Request，重點檢查：
            - 程式邏輯是否正確、有沒有 bug
            - 測試是否足夠
            - 程式碼是否清楚易讀

            具體問題請用行內留言標在對應的程式碼行上；
            整體評語請留一則一般留言。
          # 只允許 Claude 使用這些工具：讀 PR、看 diff、留言
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"'
